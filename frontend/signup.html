{% extends "layout.html" %}

{% block title %}
Sign Up
{% endblock %}

{% block main %}
<div class="w-full h-full flex place-content-center mt-20">
  <form action="/signup" method="POST" class="w-1/4 p-8 bg-white/75 rounded-3xl outline outline-white h-fit">
    <h1 class="text-2xl mb-8 w-full text-center">Create an Account</h1>
    <label class={{ username_err and "text-red-500" }}>{{ username_err and username_err or "Username" }}</label>
    <input name="username" class={{ (username_err and 'outline outline-red-400' or '') .. " bg-white rounded-lg p-2 w-full shadow-md mt-1 mb-4 " }} type="text" placeholder="1-20 characters. Letters, numbers, underscores, and hyphens only" min="1" max="20" value={{ username }}>
    <label class={{ pwd_err and "text-red-500" }}>{{ pwd_err and pwd_err or "Password" }}</label>
    <input name="pwd" class={{ (pwd_err and 'outline outline-red-400' or '') .. " bg-white rounded-lg p-2 w-full shadow-md mt-1 mb-4 " }} type="password" placeholder="15+ characters" min="15" value="">
    <label class={{ confirm_err and "text-red-500" }}>{{ confirm_err and confirm_err or "Confirm Password" }}</label>
    <input name="confirm_pwd" class={{ (confirm_err and 'outline outline-red-400' or '') .. " bg-white rounded-lg p-2 w-full shadow-md mt-1 mb-4 " }} type="password" placeholder="Match the password above" min="15" value="">
    <button class="bg-linear-to-b from-red-200/30 dark:from-red-400/30 to-red-300/50 dark:to-red-600/40 hover:bg-pink-200 dark:hover:bg-red-200 hover:text-white rounded-lg cursor-pointer p-2 w-full shadow-md outline outline-pink-100" type="submit">
      Register
    </button>
    <p class="mt-4 text-center text-sm">You will be redirected to the login page upon successful registration, so please save your password.</p>
  </form>
</div>
{% endblock %}
