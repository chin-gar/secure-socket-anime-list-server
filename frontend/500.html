{% extends "layout.html" %}

{% block title %}
500 Internal Server Error
{% endblock %}

{% block main %}
  <br>
  <h1 class="text-center text-3xl dark:text-white">Error 500 Internal Server Error</h1>
  <div class="flex place-content-center h-[50vh]">
    <img src="err_art.png">
  </div>
  <h2 class="text-center text-xl dark:text-white">{{ (err_reason) and err_reason or "Something is wrong with the server right now. Check in later." }}</h2>
{% endblock %}
